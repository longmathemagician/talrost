[package]
name = "talrost"
version = "0.1.2"
edition = "2021"
license = "Apache-2.0"
description = "A mathematics library for embedded scientific computation."
homepage = "https://github.com/longmathemagician/talrost"
documentation = "https://docs.rs/talrost/latest/"
repository = "https://github.com/longmathemagician/talrost"
keywords = ["math", "embedded"]
categories = ["mathematics", "embedded", "science", "no-std", "algorithms"]
authors = ["Stephen Gibbel <steve@gibbel.us>"]
readme = "README.md"

[features]
default = ["std"]
# Use the Rust standard library's float math (sqrt, sin, fma, ...).
std = []
# Math backend for `no_std` builds. If both `std` and `libm` are enabled,
# `std` wins.
libm = ["dep:libm"]
# Nightly-only: dispatch fixed-size matrix-multiply kernels (Strassen 2x2,
# Laderman 3x3, AlphaTensor-style 4x4) via `min_specialization`. Without this
# feature the naive FMA loop is used everywhere and the crate builds on stable.
specialization = []

[dependencies]
libm = { version = "0.2", optional = true }
